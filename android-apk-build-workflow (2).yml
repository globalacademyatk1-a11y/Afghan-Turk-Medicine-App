name: Build Afghan-Turk Android APK

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Find and extract the Android Studio project ZIP
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE=""
          while IFS= read -r candidate; do
            if unzip -Z1 "$candidate" | grep -Eq '(^|/)settings\.gradle\.kts$'; then
              ZIP_FILE="$candidate"
              break
            fi
          done < <(find . -maxdepth 1 -type f -name '*.zip' -print | sort)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No Android Studio project ZIP found. Upload the file named AfghanTurk_Medicine_Guide_Android_Project.zip to the repository root. The ZIP must contain settings.gradle.kts and app/build.gradle.kts."
            echo "ZIP files currently in repository:"
            find . -maxdepth 1 -type f -name '*.zip' -print
            exit 1
          fi

          echo "Using Android project: $ZIP_FILE"
          mkdir -p project
          unzip -q "$ZIP_FILE" -d project
          test -f project/settings.gradle.kts || { echo "settings.gradle.kts was not extracted to project root"; exit 1; }
          test -f project/app/build.gradle.kts || { echo "app/build.gradle.kts is missing"; exit 1; }

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle --no-daemon -p project :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Afghan-Turk-Medicine-Guide-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
