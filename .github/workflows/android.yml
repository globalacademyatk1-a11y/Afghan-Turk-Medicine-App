
name: Build Afghan-Turk Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Find and extract Android project
        shell: bash
        run: |
          set -e
          ZIP_FILE="AfghanTurk_Medicine_Guide_Android_Project.zip"
          if [ ! -f "$ZIP_FILE" ]; then
            echo "Expected Android project ZIP was not found."
            echo "Files in repository:"
            ls -la
            exit 1
          fi
          mkdir project
          unzip -q "$ZIP_FILE" -d project
          echo "Extracted project files:"
          find project -maxdepth 3 -type f | head -80

      - name: Build Android APK
        shell: bash
        run: |
          set -e
          PROJECT_DIR="$(find project -name settings.gradle.kts -printf '%h\n' | head -1)"
          if [ -z "$PROJECT_DIR" ]; then
            echo "Could not find settings.gradle.kts in the extracted project."
            exit 1
          fi
          cd "$PROJECT_DIR"
          curl -fsSL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          /tmp/gradle-8.9/bin/gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Afghan-Turk-Medicine-Guide-APK
          path: project/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
